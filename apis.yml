aid: cruz-foam
name: Cruz Foam
description: >-
  Cruz Foam is a circular materials company founded in 2017 in Santa Cruz, California by John Felts
  and Marco Rolandi out of research at the UC Santa Cruz Baskin School of Engineering. It makes a
  certified compostable replacement for expanded polystyrene, built from chitin recovered from
  shrimp and crustacean shells that would otherwise go to landfill, combined with starches and
  fibers diverted from agricultural waste streams. Its products include Cruz Foam protective
  packaging, Cruz Cool insulated cold-chain shippers, and EcoVino wine shippers, sold to consumer
  brands, appliance manufacturers, seafood and cold-chain shippers, and direct-to-consumer
  retailers. The company was named to TIME's Best Inventions of 2023 and Fast Company's Most
  Innovative Companies in 2024. Cruz Foam is a materials manufacturer rather than a software
  vendor, and publishes no commercial or developer-facing product API, no developer portal, and no
  SDKs. The only machine-readable interface it exposes is the WordPress REST content API behind its
  corporate website at cruzfoam.com, which is captured here for discovery purposes and is
  anonymously readable but read-only.
