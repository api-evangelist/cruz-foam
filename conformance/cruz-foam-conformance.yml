- id: rfc8594-sunset
  conforms: false
  evidence: No Sunset or Deprecation header observed; no deprecation policy published.
- id: idempotency-keys
  conforms: false
  evidence: No Idempotency-Key header or parameter accepted or documented.
- id: pagination
  conforms: true
  evidence: 'page/per_page/offset parameters plus X-WP-Total and X-WP-TotalPages response headers.'
compliance_program:
  published: false
  certifications: []
  detail: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR claim appears anywhere on cruzfoam.com,
    and trust.cruzfoam.com does not resolve. The company's public certification story is materials
    certification (compostability), not information-security certification, and that is a different
    regime scored elsewhere.
